# ════════════════════════════════════════════════════════════
# 백엔드 공통 정의 (YAML 앵커)
#
# 이 앱은 **MQTT 수집과 Kafka→InfluxDB 저장을 겸한다.** 저장 처리량을 늘리려고
# 통째로 복제하면 수집까지 이중화되는데, MQTT `client-id`(cleanSession=false)와
# Kafka `group.instance.id`가 둘 다 고정이라 브로커가 앞 세션을 끊고 정적 멤버가
# 서로를 밀어낸다 — 2026-09-06 실측에서 fencing 45건·연결 끊김 44건이 나고
# **컨슈머 멤버가 3에서 늘지 않았다.**
#
# 그래서 아래 `backend-storage-*`는 **수집을 끄고 저장만 하는** 인스턴스다
# (`MQTT_INGEST_ENABLED=false` + 인스턴스별 `GROUP_INSTANCE_ID_BASE`).
# 지금까지는 이 구성이 실험 스크립트의 `docker run`에만 있었다 — compose로 옮긴 것이
# 이 앵커다.
#
# 환경변수를 한 곳에 모아두는 이유: 저장 인스턴스가 주 backend와 **다른 설정으로
# 조용히 흘러가면** 그건 측정에서 드러나지 않는다(둘 다 정상 동작하고 숫자만 달라진다).
# ════════════════════════════════════════════════════════════
x-backend-env: &backend-env
  MQTT_HOST: mosquitto
  MQTT_PORT: 8883
  MQTT_TLS_ENABLED: "true"
  MQTT_TLS_KEYSTORE_PATH: /app/certs/backend.p12
  MQTT_TLS_TRUSTSTORE_PATH: /app/certs/truststore.p12
  MQTT_TLS_STORE_PASSWORD: ${MQTT_TLS_STORE_PASSWORD:-changeit}
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  INFLUXDB_URL: http://influxdb:8086
  INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
  INFLUXDB_ORG: ${INFLUXDB_ORG}
  INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  SERVER_PORT: 8080
  JWT_SECRET: ${JWT_SECRET}
  JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-600000}
  # 이전까지 .env에 있어도 컨테이너에 전달되지 않던 값들 — 부하 테스트/코드 점검 중 발견해 추가.
  RATE_LIMIT_RPM: ${RATE_LIMIT_RPM:-60}
  LOGIN_RATE_LIMIT_RPM: ${LOGIN_RATE_LIMIT_RPM:-10}
  DIAGNOSIS_RATE_LIMIT_RPH: ${DIAGNOSIS_RATE_LIMIT_RPH:-5}
  TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
  ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
  GEMINI_CACHE_TTL_MS: ${GEMINI_CACHE_TTL_MS:-300000}
  GEMINI_MAX_CONCURRENT_CALLS: ${GEMINI_MAX_CONCURRENT_CALLS:-4}
  GEMINI_CIRCUIT_FAILURE_THRESHOLD: ${GEMINI_CIRCUIT_FAILURE_THRESHOLD:-3}
  GEMINI_CIRCUIT_OPEN_MS: ${GEMINI_CIRCUIT_OPEN_MS:-60000}
  # Kafka 리스너 재시도 예산(총 경과 시간). 짧으면 짧은 장애에도 DLQ가 주 경로가 된다
  # — 2초 예산일 때 InfluxDB 90초 장애에서 트래픽의 47.6%가 DLQ로 갔다.
  KAFKA_RETRY_BUDGET_MS: ${KAFKA_RETRY_BUDGET_MS:-180000}
  TELEMETRY_SPOOL_PATH: /app/data/telemetry-spool
  TELEMETRY_SPOOL_RETRY_MS: ${TELEMETRY_SPOOL_RETRY_MS:-5000}
  # 한 주기에 처리할 spool 파일 수. retry-ms와 곱해져 드레인 속도 상한이 된다
  # (100/5초 = 20 msg/s였고, 유입 1,700 msg/s에 비해 89배 느렸다).
  TELEMETRY_SPOOL_RETRY_BATCH: ${TELEMETRY_SPOOL_RETRY_BATCH:-10000}
  # InfluxDB 저장 배치 크기 = 처리량 튜닝 손잡이 (application.yml 주석 참고).
  # 재빌드 없이 값만 바꿔 재기동하면 되도록 노출한다.
  KAFKA_MAX_POLL_RECORDS: ${KAFKA_MAX_POLL_RECORDS:-2000}
  # 리스너 컨테이너의 재시도·pause·리밸런싱 동작은 이 로거가 DEBUG여야 보인다.
  # 기본은 WARN이라 장애 중에 아무것도 안 남는다 — 2026-09-06 장기 장애 측정에서
  # "왜 리밸런싱이 안 도는가"를 로그로 확인할 수 없어 노출했다.
  # 상시 DEBUG는 정상 부하에서 로그가 폭주하므로 측정할 때만 켠다.
  LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_KAFKA_LISTENER: ${LISTENER_LOG_LEVEL:-WARN}
  TRIP_DEFAULT_HOURS: ${TRIP_DEFAULT_HOURS:-1}
  TRIP_POINT_LIMIT: ${TRIP_POINT_LIMIT:-10000}
  TRIP_GAP_THRESHOLD: ${TRIP_GAP_THRESHOLD:-3m}
  TRIP_MIN_POINTS: ${TRIP_MIN_POINTS:-3}
  TRIP_MAX_GPS_SPEED_KMH: ${TRIP_MAX_GPS_SPEED_KMH:-250}

x-backend-base: &backend-base
  build: ./backend
  # 요청 로그 패턴에 clientIp가 들어간다(logging.pattern.console). 접속 IP는 개인을
  # 식별할 수 있는 정보인데 보존 정책이 없어 컨테이너 로그가 무한히 쌓이고 있었다.
  # 상한을 준다 — 다만 이건 **용량 기준**이라 트래픽에 따라 보관 기간이 달라진다.
  # 기간 기준이 필요하면 로그 수집기를 붙여야 한다(현재 없음). docs/data-retention.md.
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "3"
  depends_on:
    kafka:
      condition: service_healthy
    influxdb:
      condition: service_healthy
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    mosquitto:
      condition: service_started
  networks:
    - telemetry-net
  restart: unless-stopped

services:

  # ════════════════════════════════════════════════════════════
  # MQTT 브로커 — Eclipse Mosquitto
  # 차량 시뮬레이터가 센서 데이터를 publish하는 진입점
  # ════════════════════════════════════════════════════════════
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: telemetry-mosquitto
    ports:
      - "${MQTT_TLS_PORT:-8883}:8883"
    volumes:
      - ./broker/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./broker/config/acl:/mosquitto/config/acl:ro
      - ./broker/certs:/mosquitto/certs:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    networks:
      - telemetry-net
    restart: unless-stopped

  # ════════════════════════════════════════════════════════════
  # Spring Boot 백엔드 — MQTT Consumer + Kafka Producer/Consumer + InfluxDB 저장
  # 수집과 저장을 겸하는 **유일한** 인스턴스다(수집은 여기서만 한다).
  # ════════════════════════════════════════════════════════════
  backend:
    <<: *backend-base
    container_name: telemetry-backend
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      # 기본 mTLS 연결에 필요한 backend.p12/truststore.p12.
      - ./broker/certs:/app/certs:ro
      - backend-spool:/app/data/telemetry-spool
    environment:
      <<: *backend-env

  # ════════════════════════════════════════════════════════════
  # 저장 전용 백엔드 — 프로파일 `scale`에서만 뜬다
  #
  #   docker compose --profile scale up -d backend-storage-1 backend-storage-2
  #
  # **먼저 알아야 할 것: 파티션이 3개면 이걸 띄워도 이득이 없다.**
  # `concurrency: 3`이라 backend 하나가 이미 파티션 3개를 다 차지한다. 늘어난
  # 컨슈머는 **유휴 멤버로만 붙는다**(2026-09-06에 멤버 9 중 6이 유휴였다).
  # 파티션을 먼저 늘려야 한다:
  #
  #   docker exec telemetry-kafka kafka-topics --bootstrap-server localhost:29092 \
  #     --alter --topic vehicle-telemetry --partitions 12
  #
  # **그리고 늘린다고 처리량이 비례해서 늘지도 않는다.** 2026-09-07 실측에서
  # 병목은 CPU가 아니라 **InfluxDB 쓰기 지연**이었고(1개 388ms → 4개 665ms),
  # 이득의 배수는 시스템의 성질이 아니라 **부하 조건의 함수**였다.
  # 같은 조건 3회에서 8 인스턴스가 56,985 / 44,279 / 26,564 msg/s로 흔들렸다 —
  # **여기서 나오는 숫자를 성능 사양처럼 인용하지 마라.**
  # 근거: `load-test/storage-scale/RESULT_20260907_repeat3.md`.
  #
  # 각 인스턴스가 주 backend와 다른 점은 셋뿐이다:
  #   1. MQTT_INGEST_ENABLED=false  — 수집을 안 한다(client-id 충돌 회피)
  #   2. GROUP_INSTANCE_ID_BASE     — 정적 멤버십 id가 겹치면 서로 fencing 한다
  #   3. spool 볼륨 없음            — 수집을 안 하니 쌓일 게 없고, 같은 볼륨을 여러
  #                                   인스턴스가 스캔하면 드레인이 서로를 덮친다
  # ════════════════════════════════════════════════════════════
  backend-storage-1:
    <<: *backend-base
    profiles: ["scale"]
    container_name: telemetry-backend-storage-1
    volumes:
      - ./broker/certs:/app/certs:ro
    environment:
      <<: *backend-env
      MQTT_INGEST_ENABLED: "false"
      GROUP_INSTANCE_ID_BASE: telemetry-storage-1

  backend-storage-2:
    <<: *backend-base
    profiles: ["scale"]
    container_name: telemetry-backend-storage-2
    volumes:
      - ./broker/certs:/app/certs:ro
    environment:
      <<: *backend-env
      MQTT_INGEST_ENABLED: "false"
      GROUP_INSTANCE_ID_BASE: telemetry-storage-2

  backend-storage-3:
    <<: *backend-base
    profiles: ["scale"]
    container_name: telemetry-backend-storage-3
    volumes:
      - ./broker/certs:/app/certs:ro
    environment:
      <<: *backend-env
      MQTT_INGEST_ENABLED: "false"
      GROUP_INSTANCE_ID_BASE: telemetry-storage-3

  # ════════════════════════════════════════════════════════════
  # 이상 감지 모듈 — Python Kafka Consumer (룰 기반 + IsolationForest)
  # ════════════════════════════════════════════════════════════
  anomaly-detector:
    build: ./anomaly-detector
    # container_name을 고정하면 `--scale`이 이름 충돌로 실패한다 — 부하 테스트로 단일
    # 인스턴스가 ~2,500 msg/s에서 lag이 발산하는 조짐을 보여 다중 인스턴스로 확장 가능하게
    # 이름 고정을 없앴다(docs/load-test-plan.md, ADR-016 참고).
    # replicas를 여기 선언해야 `docker compose up -d`(또는 down 후 재기동) 만으로도
    # 3개가 유지된다 — 선언 안 하면 기본 실행 경로에서 1개로 돌아가 버린다.
    deploy:
      replicas: 3
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ML_ENABLED: ${ML_ENABLED:-false}
      ML_MIN_SAMPLES: ${ML_MIN_SAMPLES:-200}
      ML_WINDOW_SIZE: ${ML_WINDOW_SIZE:-2000}
      ML_SCORE_THRESHOLD: ${ML_SCORE_THRESHOLD:-}
      # 측정 전용 — 켜면 메시지마다 이상 점수를 로그로 남긴다(처리량 하락).
      ML_SCORE_DUMP: ${ML_SCORE_DUMP:-false}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      # ML_ENABLED=true일 때만 실제로 연결한다(ML 꺼져 있으면 make_redis_client()가
      # None을 반환) — 파티션별 학습 상태를 저장해 재시작/리밸런싱에도 이어가기 위함(ADR-018).
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - telemetry-net
    restart: unless-stopped

  # ════════════════════════════════════════════════════════════
  # 차량 시뮬레이터 — Python MQTT Publisher
  # 실행: docker-compose --profile simulator up -d
  # 로컬 실행: cd simulator && python vehicle_simulator.py
  # ════════════════════════════════════════════════════════════
  simulator:
    build: ./simulator
    container_name: telemetry-simulator
    profiles: ["simulator"]
    depends_on:
      - mosquitto
    volumes:
      # mTLS 테스트 시 TLS_CA_CERT 등 PEM 경로가 이 디렉터리를 가리키게 된다. 평문 모드에선 미사용.
      - ./broker/certs:/app/certs:ro
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 8883
      TLS_CA_CERT: ${SIMULATOR_TLS_CA_CERT:-/app/certs/ca.crt}
      TLS_VEHICLE_CERT_DIR: /app/certs/vehicles
      VEHICLE_COUNT: ${VEHICLE_COUNT:-3}
      PUBLISH_INTERVAL: ${PUBLISH_INTERVAL:-1.0}
      ANOMALY_RATE: ${ANOMALY_RATE:-0.02}
      # ML 평가용 시나리오 (기본 0 = 비활성, 켜지 않으면 기존 동작 그대로).
      # COMPOSITE_ANOMALY_RATE: 룰이 못 잡는 복합 패턴 주입 비율 — ML 탐지 품질의 정답.
      # DRIFT_*: 정상 분포를 시간에 따라 이동시켜 재학습 주기 적정성을 재기 위한 것.
      # 사용법은 load-test/anomaly-detector-scale/README.md 참고.
      COMPOSITE_ANOMALY_RATE: ${COMPOSITE_ANOMALY_RATE:-0.0}
      DRIFT_TEMP_DELTA: ${DRIFT_TEMP_DELTA:-0.0}
      DRIFT_START_SECONDS: ${DRIFT_START_SECONDS:-300}
      DRIFT_RAMP_SECONDS: ${DRIFT_RAMP_SECONDS:-300}
      # 부하 테스트로 시뮬레이터 자체가 GIL 때문에 프로세스당 ~1,000-1,250 msg/s에서
      # 벽에 부딪히는 것을 확인 — 더 센 부하는 `docker compose run`으로 이 서비스를
      # 여러 개(다른 VEHICLE_ID_OFFSET) 동시에 띄워서 만든다.
      VEHICLE_ID_OFFSET: ${VEHICLE_ID_OFFSET:-0}
    networks:
      - telemetry-net
    restart: unless-stopped

  # ════════════════════════════════════════════════════════════
  # Zookeeper — Kafka 클러스터 코디네이터
  # ════════════════════════════════════════════════════════════
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: telemetry-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    networks:
      - telemetry-net
    restart: unless-stopped

  # ════════════════════════════════════════════════════════════
  # Kafka — 메시지 큐
  # 차량 N대의 텔레메트리 스트림을 버퍼링하고 분산 처리
  # ════════════════════════════════════════════════════════════
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: telemetry-kafka
    depends_on:
      - zookeeper
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - telemetry-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ════════════════════════════════════════════════════════════
  # Kafka 토픽 초기화 — 컨테이너 1회 실행 후 종료
  # ════════════════════════════════════════════════════════════
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: telemetry-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./kafka/init-topics.sh:/init-topics.sh:ro
    entrypoint: ["/bin/bash", "/init-topics.sh"]
    networks:
      - telemetry-net

  # ════════════════════════════════════════════════════════════
  # InfluxDB — 시계열 데이터베이스
  # 차량 센서 데이터 (속도, RPM, 온도...) 저장
  # ════════════════════════════════════════════════════════════
  influxdb:
    image: influxdb:2.7
    container_name: telemetry-influxdb
    ports:
      - "${INFLUXDB_PORT:-8086}:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN}
      # 버킷 보존 기간. **이 값을 주지 않으면 InfluxDB 2.x는 무제한으로 만든다** —
      # 그러면 GPS(lat/lng)가 담긴 텔레메트리가 계속 쌓인다(2026-09-06에 발견).
      # 90일인 이유: 조회 기능이 보는 범위가 실시간·최근이고, 90일을 넘겨 조회하는
      # 기능이 하나도 없다. 근거는 docs/data-retention.md.
      #
      # 주의: DOCKER_INFLUXDB_INIT_* 는 **버킷을 처음 만들 때만** 적용된다. 이미 볼륨이
      # 있는 환경은 이 값을 바꿔도 그대로이므로 `influx bucket update`를 직접 실행해야 한다.
      DOCKER_INFLUXDB_INIT_RETENTION: ${INFLUXDB_RETENTION:-90d}
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    networks:
      - telemetry-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ════════════════════════════════════════════════════════════
  # PostgreSQL — 관계형 데이터베이스
  # 차량 등록 정보, 이상 이벤트 이력 저장
  # ════════════════════════════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    container_name: telemetry-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - telemetry-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ════════════════════════════════════════════════════════════
  # Redis — 캐시 / Rate Limiting
  # JWT 토큰 블랙리스트, API Rate Limiting 카운터
  # ════════════════════════════════════════════════════════════
  redis:
    image: redis:7.2-alpine
    container_name: telemetry-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - telemetry-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ════════════════════════════════════════════════════════════
  # Prometheus — 메트릭 수집
  # ════════════════════════════════════════════════════════════
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: telemetry-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/rules/alerts.yml:ro
      # 저장 전용 백엔드(profile `scale`)의 스크레이프 대상. file_sd_configs가 읽는다.
      # 디렉터리째 마운트하므로 파일이 없어도 기동에 문제가 없다 — 대상이 0개일 뿐이다.
      - ./monitoring/prometheus/targets:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    networks:
      - telemetry-net
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: telemetry-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    networks:
      - telemetry-net
    restart: unless-stopped

  # ════════════════════════════════════════════════════════════
  # Grafana — 시각화 대시보드
  # ════════════════════════════════════════════════════════════
  grafana:
    image: grafana/grafana:10.4.0
    container_name: telemetry-grafana
    depends_on:
      - prometheus
      - influxdb
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-changeme}
      GF_USERS_ALLOW_SIGN_UP: "false"
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - telemetry-net
    restart: unless-stopped

# ════════════════════════════════════════════════════════════════
# 네트워크
# ════════════════════════════════════════════════════════════════
networks:
  telemetry-net:
    driver: bridge

# ════════════════════════════════════════════════════════════════
# 볼륨 (데이터 영속성)
# ════════════════════════════════════════════════════════════════
volumes:
  mosquitto-data:
  mosquitto-log:
  zookeeper-data:
  zookeeper-log:
  kafka-data:
  influxdb-data:
  influxdb-config:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
  backend-spool:
