services:

  # ════════════════════════════════════════════════════════════
  # MQTT 브로커 — Eclipse Mosquitto
  # 차량 시뮬레이터가 센서 데이터를 publish하는 진입점
  # ════════════════════════════════════════════════════════════
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: telemetry-mosquitto
    ports:
      - "${MQTT_TLS_PORT:-8883}:8883"
    volumes:
      - ./broker/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./broker/config/acl:/mosquitto/config/acl:ro
      - ./broker/certs:/mosquitto/certs:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    networks:
      - telemetry-net
    restart: unless-stopped

  # ════════════════════════════════════════════════════════════
  # Spring Boot 백엔드 — MQTT Consumer + Kafka Producer/Consumer + InfluxDB 저장
  # ════════════════════════════════════════════════════════════
  backend:
    build: ./backend
    container_name: telemetry-backend
    depends_on:
      kafka:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_started
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      # 기본 mTLS 연결에 필요한 backend.p12/truststore.p12.
      - ./broker/certs:/app/certs:ro
      - backend-spool:/app/data/telemetry-spool
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 8883
      MQTT_TLS_ENABLED: "true"
      MQTT_TLS_KEYSTORE_PATH: /app/certs/backend.p12
      MQTT_TLS_TRUSTSTORE_PATH: /app/certs/truststore.p12
      MQTT_TLS_STORE_PASSWORD: ${MQTT_TLS_STORE_PASSWORD:-changeit}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-600000}
      # 이전까지 .env에 있어도 컨테이너에 전달되지 않던 값들 — 부하 테스트/코드 점검 중 발견해 추가.
      RATE_LIMIT_RPM: ${RATE_LIMIT_RPM:-60}
      LOGIN_RATE_LIMIT_RPM: ${LOGIN_RATE_LIMIT_RPM:-10}
      DIAGNOSIS_RATE_LIMIT_RPH: ${DIAGNOSIS_RATE_LIMIT_RPH:-5}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      GEMINI_CACHE_TTL_MS: ${GEMINI_CACHE_TTL_MS:-300000}
      GEMINI_MAX_CONCURRENT_CALLS: ${GEMINI_MAX_CONCURRENT_CALLS:-4}
      GEMINI_CIRCUIT_FAILURE_THRESHOLD: ${GEMINI_CIRCUIT_FAILURE_THRESHOLD:-3}
      GEMINI_CIRCUIT_OPEN_MS: ${GEMINI_CIRCUIT_OPEN_MS:-60000}
      TELEMETRY_SPOOL_PATH: /app/data/telemetry-spool
      TELEMETRY_SPOOL_RETRY_MS: ${TELEMETRY_SPOOL_RETRY_MS:-5000}
      TRIP_DEFAULT_HOURS: ${TRIP_DEFAULT_HOURS:-1}
      TRIP_POINT_LIMIT: ${TRIP_POINT_LIMIT:-10000}
      TRIP_GAP_THRESHOLD: ${TRIP_GAP_THRESHOLD:-3m}
      TRIP_MIN_POINTS: ${TRIP_MIN_POINTS:-3}
      TRIP_MAX_GPS_SPEED_KMH: ${TRIP_MAX_GPS_SPEED_KMH:-250}
    networks:
      - telemetry-net
    restart: unless-stopped

  # ════════════════════════════════════════════════════════════
  # 이상 감지 모듈 — Python Kafka Consumer (룰 기반 + IsolationForest)
  # ════════════════════════════════════════════════════════════
  anomaly-detector:
    build: ./anomaly-detector
    # container_name을 고정하면 `--scale`이 이름 충돌로 실패한다 — 부하 테스트로 단일
    # 인스턴스가 ~2,500 msg/s에서 lag이 발산하는 조짐을 보여 다중 인스턴스로 확장 가능하게
    # 이름 고정을 없앴다(docs/load-test-plan.md, ADR-016 참고).
    # replicas를 여기 선언해야 `docker compose up -d`(또는 down 후 재기동) 만으로도
    # 3개가 유지된다 — 선언 안 하면 기본 실행 경로에서 1개로 돌아가 버린다.
    deploy:
      replicas: 3
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ML_ENABLED: ${ML_ENABLED:-false}
      ML_MIN_SAMPLES: ${ML_MIN_SAMPLES:-200}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      # ML_ENABLED=true일 때만 실제로 연결한다(ML 꺼져 있으면 make_redis_client()가
      # None을 반환) — 파티션별 학습 상태를 저장해 재시작/리밸런싱에도 이어가기 위함(ADR-018).
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - telemetry-net
    restart: unless-stopped

  # ════════════════════════════════════════════════════════════
  # 차량 시뮬레이터 — Python MQTT Publisher
  # 실행: docker-compose --profile simulator up -d
  # 로컬 실행: cd simulator && python vehicle_simulator.py
  # ════════════════════════════════════════════════════════════
  simulator:
    build: ./simulator
    container_name: telemetry-simulator
    profiles: ["simulator"]
    depends_on:
      - mosquitto
    volumes:
      # mTLS 테스트 시 TLS_CA_CERT 등 PEM 경로가 이 디렉터리를 가리키게 된다. 평문 모드에선 미사용.
      - ./broker/certs:/app/certs:ro
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 8883
      TLS_CA_CERT: ${SIMULATOR_TLS_CA_CERT:-/app/certs/ca.crt}
      TLS_VEHICLE_CERT_DIR: /app/certs/vehicles
      VEHICLE_COUNT: ${VEHICLE_COUNT:-3}
      PUBLISH_INTERVAL: ${PUBLISH_INTERVAL:-1.0}
      ANOMALY_RATE: ${ANOMALY_RATE:-0.02}
      # 부하 테스트로 시뮬레이터 자체가 GIL 때문에 프로세스당 ~1,000-1,250 msg/s에서
      # 벽에 부딪히는 것을 확인 — 더 센 부하는 `docker compose run`으로 이 서비스를
      # 여러 개(다른 VEHICLE_ID_OFFSET) 동시에 띄워서 만든다.
      VEHICLE_ID_OFFSET: ${VEHICLE_ID_OFFSET:-0}
    networks:
      - telemetry-net
    restart: unless-stopped

  # ════════════════════════════════════════════════════════════
  # Zookeeper — Kafka 클러스터 코디네이터
  # ════════════════════════════════════════════════════════════
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: telemetry-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    networks:
      - telemetry-net
    restart: unless-stopped

  # ════════════════════════════════════════════════════════════
  # Kafka — 메시지 큐
  # 차량 N대의 텔레메트리 스트림을 버퍼링하고 분산 처리
  # ════════════════════════════════════════════════════════════
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: telemetry-kafka
    depends_on:
      - zookeeper
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - telemetry-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ════════════════════════════════════════════════════════════
  # Kafka 토픽 초기화 — 컨테이너 1회 실행 후 종료
  # ════════════════════════════════════════════════════════════
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: telemetry-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./kafka/init-topics.sh:/init-topics.sh:ro
    entrypoint: ["/bin/bash", "/init-topics.sh"]
    networks:
      - telemetry-net

  # ════════════════════════════════════════════════════════════
  # InfluxDB — 시계열 데이터베이스
  # 차량 센서 데이터 (속도, RPM, 온도...) 저장
  # ════════════════════════════════════════════════════════════
  influxdb:
    image: influxdb:2.7
    container_name: telemetry-influxdb
    ports:
      - "${INFLUXDB_PORT:-8086}:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN}
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    networks:
      - telemetry-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ════════════════════════════════════════════════════════════
  # PostgreSQL — 관계형 데이터베이스
  # 차량 등록 정보, 이상 이벤트 이력 저장
  # ════════════════════════════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    container_name: telemetry-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - telemetry-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ════════════════════════════════════════════════════════════
  # Redis — 캐시 / Rate Limiting
  # JWT 토큰 블랙리스트, API Rate Limiting 카운터
  # ════════════════════════════════════════════════════════════
  redis:
    image: redis:7.2-alpine
    container_name: telemetry-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - telemetry-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ════════════════════════════════════════════════════════════
  # Prometheus — 메트릭 수집
  # ════════════════════════════════════════════════════════════
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: telemetry-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/rules/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    networks:
      - telemetry-net
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: telemetry-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    networks:
      - telemetry-net
    restart: unless-stopped

  # ════════════════════════════════════════════════════════════
  # Grafana — 시각화 대시보드
  # ════════════════════════════════════════════════════════════
  grafana:
    image: grafana/grafana:10.4.0
    container_name: telemetry-grafana
    depends_on:
      - prometheus
      - influxdb
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-changeme}
      GF_USERS_ALLOW_SIGN_UP: "false"
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - telemetry-net
    restart: unless-stopped

# ════════════════════════════════════════════════════════════════
# 네트워크
# ════════════════════════════════════════════════════════════════
networks:
  telemetry-net:
    driver: bridge

# ════════════════════════════════════════════════════════════════
# 볼륨 (데이터 영속성)
# ════════════════════════════════════════════════════════════════
volumes:
  mosquitto-data:
  mosquitto-log:
  zookeeper-data:
  zookeeper-log:
  kafka-data:
  influxdb-data:
  influxdb-config:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
  backend-spool:
