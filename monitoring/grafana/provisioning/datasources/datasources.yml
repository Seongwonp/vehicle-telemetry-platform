apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: InfluxDB
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: ${INFLUXDB_ORG}
      defaultBucket: ${INFLUXDB_BUCKET}
      tlsSkipVerify: true
    secureJsonData:
      token: ${INFLUXDB_TOKEN}
    editable: false

  # 대시보드 변수 "등록된 활성 차량" 전용. 읽기 전용 역할(grafana_reader)로 vehicles의
  # vehicle_id·active 두 열만 읽는다. 역할은 scripts/grafana-pg-reader.sh가 만든다.
  # 비밀번호가 비어 있으면 변수 목록이 비고 InfluxDB 패널도 비어 보인다(실험 차량이 새는 쪽이 아니라 닫히는 쪽).
  - name: PostgreSQL-registry
    uid: telemetry-pg-registry
    type: postgres
    access: proxy
    url: postgres:5432
    user: grafana_reader
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      postgresVersion: 1600
      maxOpenConns: 2
    secureJsonData:
      password: ${GRAFANA_PG_READER_PASSWORD}
    editable: false
