groups:
  - name: telemetry-platform
    rules:
      - alert: TelemetryBackendDown
        expr: up{job="telemetry-backend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Telemetry backend is down"

      - alert: KafkaConsumerLagHigh
        expr: max(kafka_consumer_records_lag_max) > 10000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Kafka consumer lag exceeds 10,000"

      - alert: TelemetryDlqIncreasing
        expr: sum(increase(telemetry_kafka_dlq_published_total[5m])) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Messages are being published to a telemetry DLQ"

      - alert: TelemetryDlqPublishFailure
        expr: sum(increase(telemetry_kafka_dlq_publish_failures_total[5m])) > 0
        labels:
          severity: critical
        annotations:
          summary: "Publishing to a telemetry DLQ failed"

      # 브로커가 구독자에게 못 넘겨 버린 메시지 — 곧바로 데이터 유실이다.
      # 애플리케이션 지표(MQTT 수신 수, Kafka 발행 수, Consumer lag)로는 절대 안 잡힌다:
      # 수집이 초당 20건으로 막혀 있던 동안 셋 다 서로 일치하며 정상으로 보였다.
      # 브로커만이 아는 값이라 백엔드가 $SYS를 구독해 게이지로 내보낸다.
      - alert: MqttBrokerDroppingMessages
        expr: increase(telemetry_mqtt_broker_messages_dropped[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "MQTT 브로커가 메시지를 버리고 있음 — 수집 유실 발생 중"

      # 브로커가 받은 양과 백엔드가 실제로 처리한 양의 괴리. 위 dropped가 오르기 전
      # 단계(브로커 큐에 쌓이는 중)에서 먼저 뜨는 조기 경보다.
      - alert: MqttIngestFallingBehind
        expr: >
          rate(telemetry_mqtt_broker_messages_received[5m])
            - rate(telemetry_mqtt_messages_received_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "백엔드가 MQTT 유입 속도를 못 따라가고 있음 (브로커 수신 대비 처리 부족)"

      # 위 규칙은 차이가 초당 10건을 넘어야 뜬다 — 3대 시뮬레이터(초당 약 3건) 규모에서는 백엔드 수신이
      # **완전히 0**이어도 영영 안 뜬다. 구독이 빠진 경우(재시작 직후 구독 timeout, 2026-10-05 실험 C·E·F·G),
      # 어댑터가 멈춘 경우, 핸들러가 막힌 경우를 원인과 무관하게 잡으려면 "브로커는 받는데 백엔드는 0"을 직접 본다.
      # 2분 창 + for 2m: 백엔드 재시작·재접속(실험 E2에서 수신 재개까지 약 7초)은 넘기고, 진짜 정지는 약 4분에 잡는다.
      # 0.1/s(분당 6건) 문턱은 이 저장소의 시뮬레이터 규모(차량 수십 대 × 초당 수 건) 기준이다 — 유입이 이보다 적은 배치에선 침묵한다.
      # 단위 테스트: monitoring/prometheus/alerts_test.yml (promtool test rules).
      - alert: MqttIngestStopped
        expr: >
          sum(rate(telemetry_mqtt_broker_messages_received[2m])) > 0.1
            and sum(rate(telemetry_mqtt_messages_received_total[2m])) == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "브로커에는 메시지가 들어오는데 백엔드 수신이 0 — 구독 누락·어댑터 정지 의심"
          runbook: "docs/runbook/pipeline-observability.md"

      # MqttIngestStopped는 브로커 $SYS 게이지가 있어야 성립한다. 게이지는 첫 $SYS 메시지 때 등록되므로
      # $SYS가 백엔드에 오지 않으면(구독 거부·ACL·$SYS 어댑터 정지) 지표 자체가 없어 위 알림이 침묵한다
      # (2026-10-06 실험 H-2a). 추적 토픽은 구독 때 보존 값으로 한 번 온다(관찰: 유휴 중 재기동한 백엔드도 dropped=0을 받았다) —
      # 백엔드가 떠 있는데 5분째 없으면 이상이다. dropped도 본다: 필터 하나만 거부되면 uptime 심장 박동 때문에 Stale은 안 뜬다.
      - alert: MqttBrokerMetricsMissing
        expr: >
          (absent(telemetry_mqtt_broker_messages_received) or absent(telemetry_mqtt_broker_messages_dropped))
            and on() (sum(up{job="telemetry-backend"}) > 0)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "백엔드가 브로커 $SYS 통계를 받지 못함 — MqttIngestStopped가 동작하지 않는 상태"

      # 위는 게이지가 **없을** 때다. 게이지는 한 번 생기면 지워지지 않아 $SYS가 끊겨도 마지막 값이 남고,
      # 그 rate는 0이라 MqttIngestStopped가 조용해진다. 갱신 시각은 $SYS/broker/uptime(매 sys_interval, 기본 10초)으로도 움직인다 —
      # 추적 토픽은 값이 바뀔 때만 와서 유휴 스택에서 거짓으로 떴다(2026-10-06 실험 U0). 2분이면 12주기 누락.
      - alert: MqttBrokerMetricsStale
        expr: time() - max(telemetry_mqtt_broker_last_update_seconds) > 120
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "브로커 $SYS 통계가 2분 넘게 갱신되지 않음 — MqttIngestStopped가 동작하지 않는 상태"

      # Paho 콜백 스레드의 저장 확인 대기 하나가 producer 최악 상한을 넘겼다(ADR-029, 2026-10-08 추가).
      # 대기 하나의 정상 상한 = max.block.ms 10s + delivery.timeout.ms 30s = 40s(그 뒤엔 spool로 완료) < keepAlive 60s.
      # 문턱 45s = 40s + spool 기록·스케줄링 여유 5s. 이걸 넘으면 상한 설정이 깨졌거나(설정 회귀·spool 디스크 정지 등)
      # 콜백이 다른 곳에서 막힌 것이다 — 그동안 수신 큐(10건)가 차면 receiver가 EOF를 못 읽어 끊김 인지·재접속도 늦다(실험 D2).
      # for 없음: 게이지가 **한 대기의 연속 경과 시간**이라 값 ≥45 자체가 "45초 내내 막혀 있었다"이다.
      # for를 두면 scrape 15s 단위로 확인이 늦어져 keepAlive(60s) 뒤로 밀린다. 탐지: 대기 시작 후 45~75s(scrape+평가 각 15s).
      # 한계: Kafka 장기 정지는 잡지 않는다 — 첫 대기가 약 30s에 spool로 끝나고, 그 뒤엔 spool 백로그로 새 메시지가
      # spool에 직행해 대기가 1s 미만이 된다(실험 D3, 1회: 76s pause 중 최대 29.9s, 알림 없음). 그 상태는 spool 지표로 본다.
      # 단위 테스트: alerts_test.yml.
      - alert: MqttAckWaitStuck
        expr: max by (job, instance) (telemetry_mqtt_ack_wait_elapsed_seconds) >= 45
        labels:
          severity: warning
        annotations:
          summary: "MQTT 저장 확인 대기가 45초 이상 진행 중 — producer 상한(40초) 초과, 수신·재접속 지연 가능"
          runbook: "docs/runbook/pipeline-observability.md"

      # 12시간 soak에서 실제로 일어난 사고의 신호다: MQTT는 계속 들어오는데 InfluxDB
      # 저장이 26초 만에 멈췄고, 그런데도 Kafka lag은 끝까지 0이라(offset이 계속 커밋됨)
      # 기존 알림이 하나도 안 떴다. "lag이 0"은 "잘 처리되고 있다"가 아니라 "offset이
      # 전진했다"일 뿐이라, 유입과 저장을 **대조**해야만 잡힌다.
      #
      # write.failures로는 못 잡는다 — 조용히 커밋하던 그 버그에서는 실패 카운터조차
      # 안 올랐다. 그래서 "성공한 저장이 0인가"를 직접 본다.
      #
      # rate 창을 2분으로 좁힌 이유: 5분 창으로 두면 장애 직전의 성공분이 창에 남아
      # rate가 0이 되기까지 5분이 더 걸린다. 실측하면 탐지까지 약 9분이 걸렸다 —
      # 유실이 진행 중인 알림으로는 너무 느리다. 2분 창 + for 2m이면 약 4분이다.
      # 순간적인 blip으로 오탐이 나지 않는 것은 for 2m과 "유입이 있을 때만"이라는
      # 조건이 함께 막는다.
      - alert: TelemetryStorageStalled
        expr: >
          sum(rate(telemetry_mqtt_messages_received_total[2m])) > 1
            and sum(rate(telemetry_influx_points_written_total[2m])) == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "텔레메트리는 계속 들어오는데 InfluxDB 저장이 멈춤 — Kafka lag이 정상이어도 유실 중"

      # 단계 간 괴리. 유입 대비 저장 성공이 크게 모자라면 어딘가에서 새고 있다.
      # DLQ로 격리된 분은 저장되지 않은 게 맞으므로 함께 더해 비교한다 —
      # 격리는 유실이 아니라 재처리 대상이기 때문이다.
      - alert: TelemetryStorageRatioLow
        expr: >
          (sum(rate(telemetry_influx_points_written_total[10m]))
             + sum(rate(telemetry_kafka_dlq_published_total[10m])))
            / clamp_min(sum(rate(telemetry_mqtt_messages_received_total[10m])), 0.001) < 0.95
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "MQTT 수신 대비 저장+격리 합이 95% 미만 — 어느 단계에서 새는지 파이프라인 대시보드로 확인할 것"

      # spool은 Kafka 장애 시 유실을 막는 장치인데, 드레인이 유입을 못 따라가면
      # 계속 자란다(실측: 배치 100일 때 드레인 19 msg/s로 유입의 1/89였다).
      - alert: TelemetrySpoolNotDraining
        expr: sum(telemetry_spool_pending) > 0 and deriv(sum(telemetry_spool_pending)[10m:]) >= 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "spool이 10분간 줄지 않음 — 드레인이 유입을 못 따라가거나 Kafka가 계속 실패 중"

      - alert: InfluxDbOperationFailures
        expr: sum(increase(telemetry_influx_write_failures_total[5m])) + sum(increase(telemetry_influx_query_failures_total[5m])) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "InfluxDB write or query failures detected"

      # Redis 장애 중 조회 rate limit은 fail-open으로 통과시킨다
      # (docs/redis-failure-policy.md §8-1). 통과 자체는 의도된 동작이지만,
      # **그동안 남용 방어가 없는 상태**라서 반드시 보여야 한다.
      #
      # 임계를 추정하지 않았다 — 이 카운터는 Redis에 못 닿을 때만 오르므로
      # **정상 구간 값이 0이다.** 그래서 "0보다 크면"이 근거 있는 임계다.
      #
      # 이 값을 "통과한 요청 수"로 읽지 않는다. 뜻은 "일반 rate limit이 적용되지 않은
      # 요청 수"이고, 그중 일부는 그 뒤 진단 제한(fail-closed)에서 거부된다.
      - alert: RateLimitFailingOpen
        # **진행 중 알림이다**(2026-09-13 변경, load-test/redis-outage/RESULT_20260913_alert_timing.md).
        # 기존 `increase(경로별[5m])`은 사실상 "최근 5분 내 발생 이력"이라 복구 뒤에야 firing하고 5분 늦게 풀렸다.
        #  - 경로 합계 카운터(_all_total)는 **기동 시 0으로 등록**된다. 경로별 카운터는 첫 실패에서 시계열이 생겨
        #    increase()가 첫 증가를 못 봤다(측정에서 15~30s 손실).
        #  - 창 [1m]: 실패가 멈추면 약 1분 뒤 거짓이 된다. scrape 15s의 4배라 샘플이 모자라지 않는다.
        #  - for: 1m은 유지한다 — 확인 구간을 없애지 않는다.
        # 요청이 없으면 이 카운터는 오르지 않는다 — Redis가 죽어도 요청이 없으면 울리지 않는다.
        expr: sum(increase(telemetry_ratelimit_failopen_all_total[1m])) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "최근 1분 동안 조회 rate limit이 적용되지 않은 요청이 계속됐다(Redis 미접속) — 지금 남용 방어가 없다. 요청이 없으면 울리지 않는다. docs/runbook/redis-outage.md"

      # fail-closed로 남긴 경로(진단·로그인 보호·refresh)가 실제로 거부되고 있다.
      # 위 알림과 **같이 오르는 것이 정상**이다 — 같은 장애의 양쪽 면이다.
      - alert: RedisUnavailableRejections
        # 위 RateLimitFailingOpen과 같은 이유로 합계 카운터·[1m]·for 1m (진행 중 알림).
        expr: sum(increase(telemetry_redis_unavailable_all_total[1m])) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "최근 1분 동안 Redis 미접속으로 요청 거부가 계속됐다(진단·로그인·refresh) — 요청이 없으면 울리지 않는다. docs/runbook/redis-outage.md"
