global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # Spring Boot Actuator 메트릭
  - job_name: 'telemetry-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['backend:8080']
        labels:
          app: 'vehicle-telemetry-backend'

  # 저장 전용 백엔드(profile `scale`) — 있을 때만 긁는다.
  #
  # static_configs가 아니라 file_sd_configs인 이유: 이 인스턴스들은 평상시에 안 뜬다.
  # 대상을 설정에 고정으로 적어두면 프로파일을 안 켠 동안 계속 `up == 0`으로 보이고,
  # 그건 장애처럼 보이는 정상이라 알림 피로를 만든다. 파일이 없으면 대상이 0개다.
  # 파일은 `scripts/scale-storage.sh`가 만들고 지운다(재시작 불필요).
  #
  # TelemetryBackendDown 알림은 job="telemetry-backend"로 한정돼 있어 이 job에는
  # 걸리지 않는다 — 저장 인스턴스가 죽으면 처리량이 떨어질 뿐 수집은 계속된다.
  - job_name: 'telemetry-backend-storage'
    metrics_path: '/actuator/prometheus'
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/backend-storage.json
        refresh_interval: 30s

  # Prometheus 자체 메트릭
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
