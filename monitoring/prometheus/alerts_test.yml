# promtool test rules alerts_test.yml — 수신 정지 계열 알림이 의도한 시점에 뜨고, 정상에선 안 뜨는지 고정한다.
# 시계는 0에서 시작하고 평가 간격은 1분이다. 실스택 관찰(실험 H·T)과 별개로 규칙식 자체의 회귀를 막는다.
rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  # 브로커는 초당 1건을 받는데 백엔드 수신 카운터는 그대로 — 1분부터 조건 성립, for 2m 뒤 firing.
  - interval: 1m
    input_series:
      - series: 'telemetry_mqtt_broker_messages_received{job="telemetry-backend"}'
        values: '0+60x15'
      - series: 'telemetry_mqtt_messages_received_total{job="telemetry-backend"}'
        values: '100x15'
      - series: 'up{job="telemetry-backend"}'
        values: '1x15'
    alert_rule_test:
      - eval_time: 2m
        alertname: MqttIngestStopped
        exp_alerts: []
      - eval_time: 4m
        alertname: MqttIngestStopped
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "브로커에는 메시지가 들어오는데 백엔드 수신이 0 — 구독 누락·어댑터 정지 의심"
              runbook: "docs/runbook/pipeline-observability.md"

  # 정상: 백엔드도 같이 받는다 — 뜨지 않는다. 문턱(0.1/s) 아래 유입도 뜨지 않는다(알려진 한계).
  - interval: 1m
    input_series:
      - series: 'telemetry_mqtt_broker_messages_received{job="telemetry-backend"}'
        values: '0+60x15'
      - series: 'telemetry_mqtt_messages_received_total{job="telemetry-backend"}'
        values: '0+60x15'
      - series: 'telemetry_mqtt_broker_messages_received{job="low"}'
        values: '0+3x15'
      - series: 'telemetry_mqtt_broker_messages_dropped{job="telemetry-backend"}'
        values: '0x15'
      - series: 'up{job="telemetry-backend"}'
        values: '1x15'
      - series: 'telemetry_mqtt_broker_last_update_seconds'
        values: '0+60x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: MqttIngestStopped
        exp_alerts: []
      - eval_time: 10m
        alertname: MqttBrokerMetricsMissing
        exp_alerts: []
      - eval_time: 10m
        alertname: MqttBrokerMetricsStale
        exp_alerts: []

  # 백엔드는 떠 있는데 $SYS 게이지가 한 번도 없다 — for 5m 뒤 firing. 백엔드가 없으면 뜨지 않는다.
  - interval: 1m
    input_series:
      - series: 'up{job="telemetry-backend"}'
        values: '1x10 0x10'
    alert_rule_test:
      - eval_time: 4m
        alertname: MqttBrokerMetricsMissing
        exp_alerts: []
      - eval_time: 6m
        alertname: MqttBrokerMetricsMissing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "백엔드가 브로커 $SYS 통계를 받지 못함 — MqttIngestStopped가 동작하지 않는 상태"
      - eval_time: 18m
        alertname: MqttBrokerMetricsMissing
        exp_alerts: []

  # 게이지는 남아 있는데 2분에 갱신이 멈췄다 — 이때 MqttIngestStopped는 옛 값의 rate(0)를 봐서 침묵한다.
  # 지연 120초 초과는 5분부터, for 3m 뒤 8분에 firing.
  - interval: 1m
    input_series:
      - series: 'telemetry_mqtt_broker_last_update_seconds'
        values: '0 60 120 120x15'
      - series: 'telemetry_mqtt_broker_messages_received{job="telemetry-backend"}'
        values: '0 60 120 120x15'
      - series: 'telemetry_mqtt_messages_received_total{job="telemetry-backend"}'
        values: '0x17'
    alert_rule_test:
      - eval_time: 7m
        alertname: MqttBrokerMetricsStale
        exp_alerts: []
      - eval_time: 9m
        alertname: MqttBrokerMetricsStale
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "브로커 $SYS 통계가 2분 넘게 갱신되지 않음 — MqttIngestStopped가 동작하지 않는 상태"
      - eval_time: 9m
        alertname: MqttIngestStopped
        exp_alerts: []

  # received는 오는데 dropped 구독만 빠졌다(필터 하나만 SUBACK 0x80) — uptime 심장 박동이 Stale을 막으므로 Missing이 잡는다.
  - interval: 1m
    input_series:
      - series: 'up{job="telemetry-backend"}'
        values: '1x10'
      - series: 'telemetry_mqtt_broker_messages_received{job="telemetry-backend"}'
        values: '0+60x10'
      - series: 'telemetry_mqtt_broker_last_update_seconds'
        values: '0+60x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: MqttBrokerMetricsMissing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "백엔드가 브로커 $SYS 통계를 받지 못함 — MqttIngestStopped가 동작하지 않는 상태"
      - eval_time: 6m
        alertname: MqttBrokerMetricsStale
        exp_alerts: []
