# 명시적 로컬 평문 개발 프로파일:
# docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
services:
  mosquitto:
    ports:
      - "127.0.0.1:${MQTT_PORT:-1883}:1883"
    volumes:
      - ./broker/config/mosquitto-dev.conf:/mosquitto/config/mosquitto.conf:ro

  backend:
    environment:
      MQTT_PORT: 1883
      MQTT_TLS_ENABLED: "false"

  simulator:
    environment:
      MQTT_PORT: 1883
      TLS_CA_CERT: ""
      TLS_CLIENT_CERT: ""
      TLS_CLIENT_KEY: ""
      TLS_VEHICLE_CERT_DIR: ""
