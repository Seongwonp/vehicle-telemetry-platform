# 로컬 개발 전용. docker-compose.dev.yml을 명시한 경우에만 사용한다.
listener 1883
protocol mqtt
allow_anonymous true
max_packet_size 65536
# 운영(mosquitto.conf)과 같은 값으로 맞춘다. 기본값 1000은 부하 테스트에서 구독자가
# 잠깐만 밀려도 큐가 넘쳐 메시지가 조용히 버려진다 — 실제로 이 때문에 수집 유실을
# 브로커 탓으로 오인할 뻔했다.
max_queued_messages 10000
log_dest stdout
# log_type all은 PUBLISH/PUBACK을 전부 남긴다. 초당 수천 건 부하에서는 브로커 CPU와
# 디스크를 로깅이 잡아먹어 측정 자체를 왜곡하므로 운영과 같은 수준만 남긴다.
log_type error
log_type warning
log_type notice
log_timestamp true
persistence true
persistence_location /mosquitto/data/
