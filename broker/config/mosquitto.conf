# 운영 기본 프로파일: TLS 1.2+와 클라이언트 인증서를 필수로 요구한다.
per_listener_settings true
listener 8883
protocol mqtt

cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate true
use_identity_as_username true
tls_version tlsv1.2

allow_anonymous false
acl_file /mosquitto/config/acl

# 비정상 대용량 payload로 인한 broker/backend 메모리 고갈 방지
max_packet_size 65536

# 구독자(backend)가 끊긴 동안 브로커가 대신 쌓아두는 메시지 수. 넘으면 **말없이 버린다.**
#
# 10,000이었다. 브로커 90초 장애에서는 충분했지만(backend가 약 2초에 재연결해 드레인),
# **300초 장애에서 17,243건(4.7%)이 버려졌다** — 밀렸던 것이 한꺼번에 쏟아질 때
# 구독자가 드레인하는 속도를 잠깐 넘어서기 때문이다.
# (load-test/fault-injection/RESULT_20260905_mqtt_broker.md)
#
# 필요량은 대략 "장애 시간 × 유입 속도"의 오버슈트분이다. 설계 부하(1,000 msg/s)에서
# 300초 장애의 백로그가 약 30만 건인데 그중 넘친 게 1.7만이라, 10배인 100,000이면
# 같은 조건을 덮는다. 메모리로 환산하면 payload 300B 기준 약 30MB다.
#
# 이 값을 늘려도 **유실이 사라지는 게 아니라 뒤로 밀릴 뿐**이다. 진짜 방어선은
# `MqttBrokerDroppingMessages` 알림($SYS dropped)이다 — 애플리케이션 지표로는
# 절대 안 보이는 유실이라 브로커에게 직접 물어야 한다.
max_queued_messages 100000

log_dest stdout
log_type error
log_type warning
log_type notice
log_timestamp true

persistence true
persistence_location /mosquitto/data/
