plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.telemetry'
version = '0.0.1-SNAPSHOT'

ext['testcontainers.version'] = '1.20.4'

java {
    sourceCompatibility = JavaVersion.VERSION_17
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // ── Spring Boot 기본 ─────────────────────────────────────
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // ── WebSocket (STOMP) — 대시보드 실시간 스트리밍 ────────────
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // ── MQTT (Spring Integration) ─────────────────────────────
    implementation 'org.springframework.integration:spring-integration-mqtt'
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'

    // ── Kafka ────────────────────────────────────────────────
    implementation 'org.springframework.kafka:spring-kafka'

    // ── InfluxDB ─────────────────────────────────────────────
    implementation 'com.influxdb:influxdb-client-java:7.0.0'

    // ── PostgreSQL + JPA ──────────────────────────────────────
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.flywaydb:flyway-core'

    // ── Redis (Rate Limiting) ─────────────────────────────────
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // ── Spring Security + JWT ─────────────────────────────────
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'

    // ── Swagger (SpringDoc OpenAPI 3) ─────────────────────────
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'

    // ── Prometheus 메트릭 ─────────────────────────────────────
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // ── Lombok ────────────────────────────────────────────────
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // ── 테스트 ───────────────────────────────────────────────
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation platform('org.testcontainers:testcontainers-bom:1.20.4')
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:kafka'
}

tasks.named('test') {
    useJUnitPlatform()
    // Docker Engine 29+는 legacy API를 거부한다. docker-java/Testcontainers가
    // 지원되는 API로 통신하도록 명시해 로컬/CI 계약 테스트가 조용히 skip되지 않게 한다.
    systemProperty 'api.version', '1.44'
}
