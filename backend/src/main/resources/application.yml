spring:
  application:
    name: vehicle-telemetry-backend

  # ── PostgreSQL ───────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:telemetry}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

  # ── Redis ────────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

  # ── Kafka ────────────────────────────────────────────────────
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      properties:
        # max.poll.interval.ms(기본 5분)를 넘기면 정적 멤버십 없이는 컨슈머가 그룹을
        # 완전히 떠났다가(member id 리셋) 재가입해야 하는데, concurrency=3인 상태에서
        # 여러 컨슈머가 동시에 이 경로를 타면 "MemberIdRequiredException → group is
        # already rebalancing"에 갇혀 영영 복구가 안 되는 걸 12시간 soak test로 확인했다.
        # group.instance.id를 주면(Concurrent 컨테이너가 -0/-1/-2로 자동 접미사를 붙인다)
        # poll 간격을 잠깐 넘겨도 세션을 유지한 채 재가입할 수 있어 이 rebalance storm을
        # 피할 수 있다.
        group.instance.id: ${GROUP_INSTANCE_ID_BASE:telemetry-backend-consumer}
        # 두 리스너가 모두 배치(KafkaConfig.telemetryBatchListenerContainerFactory)라
        # 이 값이 곧 한 번에 묶이는 건수다 — 저장 경로는 InfluxDB 쓰기 1건,
        # 알림 경로는 PostgreSQL 트랜잭션 1건에 대응한다. 처리량 튜닝 손잡이다.
        #
        # 실측(부하 ~9,000 msg/s)에서 InfluxDB 쓰기 비용은 배치 크기에 거의 비례하지 않는다:
        # 14포인트 0.81초, 89포인트 0.97초, 460포인트 0.91초 — 요청당 고정비가 약 0.8초로
        # 지배적이다(이 호스트는 Docker Desktop/WSL2라 fsync가 특히 비싸다). 따라서 배치를
        # 키울수록 처리량이 거의 선형으로 오른다. 재빌드 없이 실험할 수 있게 환경변수로 뺐다.
        # 메시지가 약 250바이트라 max.partition.fetch.bytes 기본값(1MB, 약 4,000건) 안에서
        # 안전하게 올릴 수 있고, 배치 처리 시간은 max.poll.interval.ms(5분)에 한참 못 미친다.
        max.poll.records: ${KAFKA_MAX_POLL_RECORDS:2000}
    listener:
      # 이 아래 값들은 KafkaConfig가 ConcurrentKafkaListenerContainerFactoryConfigurer로
      # 물려받는다. 예전에는 커스텀 팩토리가 이 설정을 안 물려받고 같은 값을 Java에
      # 하드코딩하고 있어서, **여기를 고쳐도 동작이 안 바뀌는** 상태였다(P0-3에서 발견).
      ack-mode: manual_immediate
      # 부하 테스트 결과(docs/load-test-plan.md 5절): 파티션 3개에 맞춘 기본값.
      # 멀티프로세스 시뮬레이터로 실제 배압(anomaly-detector-group lag 200만+)이 걸리는
      # ~2,500 msg/s에서 concurrency 1과 3을 재검증했지만 telemetry-storage-group lag은
      # 두 설정 모두 수백 단위로 비슷했다 — 이 컨슈머(Kafka→InfluxDB)는 메시지당 처리가
      # 가벼워서 1과 3 사이에 유의미한 차이가 없었다. 파티션 수와 맞춘 설정이라 유지.
      concurrency: 3

# ── MQTT ─────────────────────────────────────────────────────
mqtt:
  host: ${MQTT_HOST:localhost}
  port: ${MQTT_PORT:8883}
  topic: "vehicle/telemetry/#"
  client-id: ${MQTT_CLIENT_ID:telemetry-backend}
  # 자동 재연결 백오프의 상한. Paho 기본값은 128초인데, 그동안 브로커는 우리 세션
  # 앞으로 온 메시지를 max_queued_messages(10,000)까지만 담고 나머지를 버린다.
  # 브로커 90초 장애를 주입해 재보니 복구 후 재연결까지 벌어진 틈에 129,447건이
  # 버려졌다(load-test/fault-injection/RESULT_20260905_mqtt_broker.md).
  max-reconnect-delay-ms: ${MQTT_MAX_RECONNECT_DELAY_MS:5000}
  tls:
    # 기본값은 mTLS 강제. 평문 로컬 개발은 docker-compose.dev.yml에서만 false로 덮어쓴다.
    enabled: ${MQTT_TLS_ENABLED:true}
    keystore-path: ${MQTT_TLS_KEYSTORE_PATH:}
    truststore-path: ${MQTT_TLS_TRUSTSTORE_PATH:}
    store-password: ${MQTT_TLS_STORE_PASSWORD:changeit}

telemetry:
  kafka:
    retry:
      # 재시도 예산. 이 시간을 넘기면 DLQ로 간다.
      # **벽시계 시간이 아니라 "백오프로 쉰 시간의 합"이다.** 리스너가 실패하는 데 쓴
      # 시간은 안 세므로 실제 내성은 이 값보다 훨씬 길다 — PostgreSQL 300초 장애에서
      # DLQ 0건이었다(시도마다 HikariCP 30초를 기다려 백오프 합이 180초에 못 미쳤다).
      # 자세한 내용은 KafkaConfig.buildBackOff 주석 참고.
      budget-ms: ${KAFKA_RETRY_BUDGET_MS:180000}
      initial-interval-ms: ${KAFKA_RETRY_INITIAL_INTERVAL_MS:1000}
      multiplier: ${KAFKA_RETRY_MULTIPLIER:2.0}
      max-interval-ms: ${KAFKA_RETRY_MAX_INTERVAL_MS:30000}
  spool:
    path: ${TELEMETRY_SPOOL_PATH:data/telemetry-spool}
    retry-ms: ${TELEMETRY_SPOOL_RETRY_MS:5000}
    # 한 주기에 처리할 spool 파일 수. retry-ms와 곱해져 드레인 속도 상한이 된다.
    retry-batch: ${TELEMETRY_SPOOL_RETRY_BATCH:10000}
  trip:
    default-hours: ${TRIP_DEFAULT_HOURS:1}
    point-limit: ${TRIP_POINT_LIMIT:10000}
    gap-threshold: ${TRIP_GAP_THRESHOLD:3m}
    min-points: ${TRIP_MIN_POINTS:3}
    max-gps-speed-kmh: ${TRIP_MAX_GPS_SPEED_KMH:250}

# ── InfluxDB ─────────────────────────────────────────────────
influxdb:
  url: ${INFLUXDB_URL:http://localhost:8086}
  token: ${INFLUXDB_TOKEN}
  org: ${INFLUXDB_ORG:vehicle-telemetry}
  bucket: ${INFLUXDB_BUCKET:telemetry}

# ── JWT ──────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:600000}

# ── 관리자 계정 (Phase 2 임시, Phase 4에서 DB 기반으로 교체) ──
admin:
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD:changeme}

# ── CORS (Flutter web에서 호출할 때만 필요) ────────────────────
cors:
  allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# ── Rate Limiting ────────────────────────────────────────────
rate-limit:
  requests-per-minute: ${RATE_LIMIT_RPM:60}
  login-attempts-per-minute: ${LOGIN_RATE_LIMIT_RPM:10}
  diagnosis-requests-per-hour: ${DIAGNOSIS_RATE_LIMIT_RPH:5}

security:
  # X-Forwarded-For는 여기에 명시한 reverse proxy에서 온 요청에만 신뢰한다.
  trusted-proxies: ${TRUSTED_PROXY_IPS:}

# ── Gemini AI 진단 (Phase 9) ───────────────────────────────────
gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.0-flash}
  cache-ttl-ms: ${GEMINI_CACHE_TTL_MS:300000}
  max-concurrent-calls: ${GEMINI_MAX_CONCURRENT_CALLS:4}
  circuit-failure-threshold: ${GEMINI_CIRCUIT_FAILURE_THRESHOLD:3}
  circuit-open-ms: ${GEMINI_CIRCUIT_OPEN_MS:60000}

# ── Server ───────────────────────────────────────────────────
server:
  port: ${SERVER_PORT:8080}

# ── Swagger ──────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# ── Actuator ─────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # /actuator/health는 익명 접근을 허용하므로(SecurityConfig) DB/Redis 연결 상태 등
      # 상세 정보를 노출하지 않는다. 상세 헬스체크는 인증된 채널(로그, 내부 대시보드)로 확인한다.
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    console: "%d{HH:mm:ss} [%X{traceId:--}] [%X{clientIp:--}] %-5level %logger{25} - %msg%n"
  level:
    com.telemetry: INFO
    org.springframework.security: WARN
    org.springframework.kafka: WARN
